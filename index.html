<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente</title>
<script>
  // Modo compañera: la app de escritorio abre la página con ?modo=companera
  if (new URLSearchParams(location.search).get("modo") === "companera") {
    document.documentElement.classList.add("companera");
  }
</script>
<style>
  :root { --fondo:#14142a; --panel:#262645; --acento:#39c5bb; --texto:#f2f2fa; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; align-items:center;
         background:var(--fondo); color:var(--texto); font-family:system-ui,sans-serif; }
  #escena { position:relative; flex:1 1 auto; min-height:0; width:100%; max-width:760px; }
  #lienzo { position:absolute; inset:0; width:100%; height:100%; }
  #burbuja { position:absolute; left:12px; right:12px; bottom:8px; min-height:64px;
             background:rgba(38,38,69,.88); border:2px solid var(--acento); border-radius:16px;
             padding:12px 16px; line-height:1.4; backdrop-filter:blur(4px); }
  #nombre { font-weight:700; color:var(--acento); font-size:.85rem; margin-bottom:2px; }
  #estado { color:#b9b9d6; font-weight:400; margin-left:8px; }
  #entrada { flex:0 0 auto; width:100%; max-width:760px; display:flex; gap:8px; padding:12px; }
  #entrada input { flex:1; padding:12px 14px; border-radius:12px; border:2px solid var(--panel);
                   background:var(--panel); color:var(--texto); font-size:1rem; outline:none; }
  #entrada input:focus { border-color:var(--acento); }
  #mic { padding:0 12px; font-size:1.05rem; background:var(--panel); color:var(--texto);
         border:2px solid var(--acento); }
  #mic.escuchando { background:#ff6b8b; border-color:#ff6b8b; animation:pulso 1s ease-in-out infinite; }
  #silencio { padding:0 8px; font-size:1.05rem; background:var(--panel); color:var(--texto);
              border:2px solid var(--panel); }
  #vol { position:relative; display:flex; flex:0 0 auto; }
  #vol .vol-menu { display:none; position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
                   margin-bottom:6px; padding:10px 14px; background:var(--panel); border:2px solid var(--acento);
                   border-radius:12px; z-index:6; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  #vol .vol-menu input { display:block; width:120px; min-width:0; padding:0; margin:0; border:0;
                         background:transparent; accent-color:var(--acento); cursor:pointer; }
  #vol:hover .vol-menu, #vol:focus-within .vol-menu { display:block; }
  #vol:hover::before { content:""; position:absolute; bottom:100%; left:-10px; right:-10px; height:8px; }
  #mic:disabled { opacity:.35; cursor:not-allowed; }
  @keyframes pulso { 50% { box-shadow:0 0 0 6px rgba(255,107,139,.35); } }
  button { padding:0 18px; border:0; border-radius:12px; background:var(--acento);
           color:#0d2a28; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #herramientas { position:absolute; top:8px; left:8px; display:flex; flex-wrap:wrap; gap:4px;
                  opacity:.55; z-index:2; }
  #herramientas:hover { opacity:1; }
  #herramientas button, #ajustes button { padding:4px 8px; font-size:.72rem; border-radius:8px;
                         background:var(--panel); color:var(--texto); font-weight:400; }
  #ajustes { position:absolute; top:40px; left:8px; width:270px; max-height:calc(100% - 150px);
             overflow:auto; z-index:2; background:rgba(38,38,69,.94); border:1px solid var(--acento);
             border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:4px; }
  #ajustes[hidden] { display:none; }
  #ajustes label { display:flex; flex-direction:column; font-size:.68rem; color:#b9b9d6; }
  #ajustes input[type=range] { width:100%; accent-color:var(--acento); }
  #ajustes .nota { font-size:.68rem; color:#b9b9d6; margin-bottom:4px; }

  /* ---- Modo compañera (ventana flotante transparente de Electron) ---- */
  html.companera, .companera body { background: transparent; overflow: hidden; }
  .companera #escena { max-width: none; }
  .companera #burbuja { top: 8px; bottom: auto; min-height: 0; padding: 10px 14px;
                        font-size: .92rem; transition: opacity .35s; }
  .companera #burbuja.oculta { opacity: 0; pointer-events: none; }
  .companera #entrada { display: none; position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 5;
                        width: auto; max-width: none; padding: 8px; border-radius: 14px;
                        background: rgba(38,38,69,.92); }
  .companera #entrada.visible { display: flex; }
  .companera #entrada input { min-width: 0; padding: 10px 12px; font-size: .95rem; }   /* que quepan los botones */
  #entrada #msg { min-width: 110px; }   /* nunca se encoge hasta desaparecer */
  .companera #entrada button { padding: 0 12px; flex: 0 0 auto; }
  .companera #herramientas { display: none; top: auto; bottom: 64px; }
  .companera.herramientas #herramientas { display: flex; opacity: 1; }
  .companera #ajustes { top: 60px; }
</style>
</head>
<body>
  <div id="escena">
    <canvas id="lienzo"></canvas>
    <div id="herramientas" title="Prueba las expresiones sin hablar con el modelo de lenguaje"></div>
    <div id="ajustes" hidden>
      <div class="nota">Mueve los deslizadores para ver la cara en vivo. Cuando te guste,
        pulsa «copiar valores» y pega el resultado dentro de la emoción que corresponda en
        <code>EMOCIONES</code> (index.html).</div>
    </div>
    <div id="burbuja">
      <div id="nombre"><span id="nombre-texto">...</span><span id="estado"></span></div>
      <div id="texto">Cargando...</div>
    </div>
  </div>
  <form id="entrada">
    <input id="msg" autocomplete="off" placeholder="Escribe algo..." autofocus>
    <button id="mic" type="button" title="Hablar: clic para empezar, otro clic para terminar">🎤</button>
    <span id="vol">
      <button id="silencio" type="button" title="Clic: silenciar. Pasa el mouse para el volumen">🔊</button>
      <span class="vol-menu"><input id="volumen" type="range" min="0" max="100" step="1" value="80" title="Volumen de la voz" aria-label="Volumen de la voz"></span>
    </span>
    <button id="enviar">Enviar</button>
    <button id="reset" type="button" title="Borrar la conversación">Reiniciar</button>
  </form>

<!-- Librerías (necesitan internet la primera vez). El orden importa. -->
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

<script>
// =====================================================================
//  CONFIGURACIÓN: lo que cambias cuando uses otro modelo
//  (el nombre y la personalidad se cambian en servidor.py)
// =====================================================================
const MODELO_URL = "/modelo/miku.model3.json";   // solo si el servidor no encuentra ningún .model3.json en la carpeta modelo
const ZOOM = 1.0;            // 1 = cuerpo completo. Prueba 1.8 para ver de la cintura hacia arriba
const DESPLAZAMIENTO_Y = 0;  // píxeles; positivo baja el modelo, negativo lo sube

// Parámetros que controlan la cara. Los nombres "lógicos" (PARAM_...) son los del modelo Miku; cada modelo
// los llama distinto, así que ALIAS dice qué parámetro real usar en cada uno (se elige el primero que exista).
// Los parámetros reales de un modelo están en su archivo .cdi3.json.
const BASE = {
  PARAM_EYE_L_SMILE: 0, PARAM_EYE_R_SMILE: 0,
  PARAM_BROW_L_Y: 0, PARAM_BROW_R_Y: 0,
  PARAM_BROW_L_ANGLE: 0, PARAM_BROW_R_ANGLE: 0,
  PARAM_BROW_L_FORM: 0, PARAM_BROW_R_FORM: 0,
  PARAM_MOUTH_FORM: 0, PARAM_MOUTH_OPEN_Y: 0, PARAM_CHEEK: 0,
};
const ALIAS = {
  PARAM_EYE_L_SMILE: ["ParamEyeLSmile"], PARAM_EYE_R_SMILE: ["ParamEyeRSmile"],
  PARAM_BROW_L_Y: ["ParamBrowLY"], PARAM_BROW_R_Y: ["ParamBrowRY"],
  PARAM_BROW_L_ANGLE: ["ParamBrowLAngle"], PARAM_BROW_R_ANGLE: ["ParamBrowRAngle"],
  PARAM_BROW_L_FORM: ["ParamBrowLForm"], PARAM_BROW_R_FORM: ["ParamBrowRForm"],
  PARAM_MOUTH_FORM: ["ParamMouthForm"], PARAM_MOUTH_OPEN_Y: ["ParamMouthOpenY"],
  PARAM_CHEEK: ["ParamCheek"],
  // Movimiento de cabeza, ojos y cuerpo (mirada y paseo)
  PARAM_ANGLE_X: ["ParamAngleX"], PARAM_ANGLE_Y: ["ParamAngleY"], PARAM_ANGLE_Z: ["ParamAngleZ"],
  PARAM_EYE_BALL_X: ["ParamEyeBallX"], PARAM_EYE_BALL_Y: ["ParamEyeBallY"],
  PARAM_BODY_ANGLE_X: ["ParamBodyAngleX0", "ParamBodyAngleX"], PARAM_BODY_ANGLE_Z: ["ParamBodyAngleZ0", "ParamBodyAngleZ"],
};
// Controles propios de un modelo (aquí los del modelo Jian). Se escriben con su nombre real y su etiqueta para el
// panel «ajustes»; si el modelo no los tiene, se ignoran. El rango (0 a 1, o -1 a 1) se lee del propio modelo.
const EFECTOS = {
  ParamSwitch1: "cara oscura", ParamSwitch2: "rubor", ParamSwitch4: "enojo",
  ParamSwitch5: "ojos estrella", ParamSwitch6: "ojos en blanco", ParamSwitch7: "lágrimas (brillo)",
  ParamSwitch8: "ojos corazón", ParamSwitch9: "lágrimas (caen)",
  Ear_smile: "orejas (ánimo)", ParamCheekPuff: "mejillas infladas", ParamTongueOut: "sacar lengua",
  AnimeAngry: "enojo anime 1", AnimeAngry2: "enojo anime 2", Anime_Cry: "llanto anime", Anime_Eye: "ojos en espiral",
};
// Cada emoción solo indica lo que cambia respecto a BASE (todo lo demás vuelve a 0 suavemente).
// Valores para Jian; ajústalos con «ajustes» (abajo hay un botón para copiar lo que dejes puesto).
// Con otro modelo, los nombres que no existan se ignoran sin dar error.
const EMOCIONES = {
  neutral: {},
  feliz: { PARAM_EYE_L_SMILE: .8, PARAM_EYE_R_SMILE: .8, PARAM_MOUTH_FORM: 1,
           PARAM_BROW_L_Y: .3, PARAM_BROW_R_Y: .3, PARAM_CHEEK: .6, Ear_smile: 1, ParamSwitch2: .35 },
  triste: { PARAM_MOUTH_FORM: -1, PARAM_BROW_L_Y: -.3, PARAM_BROW_R_Y: -.3,
            PARAM_BROW_L_ANGLE: -.7, PARAM_BROW_R_ANGLE: -.7,
            PARAM_BROW_L_FORM: -.6, PARAM_BROW_R_FORM: -.6, Ear_smile: -1, ParamSwitch7: 1 },
  sorprendida: { PARAM_BROW_L_Y: 1, PARAM_BROW_R_Y: 1, PARAM_MOUTH_OPEN_Y: .6, Ear_smile: .4 },
  enojada: { PARAM_MOUTH_FORM: -.7, PARAM_BROW_L_Y: -.5, PARAM_BROW_R_Y: -.5,
             PARAM_BROW_L_ANGLE: .8, PARAM_BROW_R_ANGLE: .8,
             PARAM_BROW_L_FORM: -.8, PARAM_BROW_R_FORM: -.8, Ear_smile: -1, ParamSwitch4: 1 },
  avergonzada: { PARAM_EYE_L_SMILE: .3, PARAM_EYE_R_SMILE: .3, PARAM_MOUTH_FORM: -.2, PARAM_BROW_L_Y: .2,
                 PARAM_BROW_R_Y: .2, PARAM_BROW_L_FORM: -.4, PARAM_BROW_R_FORM: -.4, PARAM_CHEEK: 1,
                 Ear_smile: -.4, ParamSwitch2: 1, ParamCheekPuff: .4 },
  emocionada: { PARAM_EYE_L_SMILE: .4, PARAM_EYE_R_SMILE: .4, PARAM_MOUTH_FORM: 1, PARAM_MOUTH_OPEN_Y: .3,
                PARAM_BROW_L_Y: .6, PARAM_BROW_R_Y: .6, Ear_smile: 1, ParamSwitch5: 1, ParamSwitch2: .3 },
};
// Segundos que dura una emoción después de terminar de hablar; luego vuelve sola a «neutral».
const EMOCION_DURA_S = 7;
// Animación del modelo (grupo definido en model3.json) que se reproduce con cada emoción. null = ninguna.
const MOVIMIENTOS = { neutral: null, feliz: "Tap", triste: null, sorprendida: "Flick", enojada: "Flick", avergonzada: null, emocionada: "Tap" };

// =====================================================================
//  Modelo Live2D
// =====================================================================
const escena = document.getElementById("escena");
const texto = document.getElementById("texto");

let model = null, anchoBase = 1, altoBase = 1, app = null;
let objetivo = { ...BASE };
const actual = { ...BASE };
let idReal = {};              // parámetro lógico -> parámetro real de este modelo (null si no lo tiene)
let hablando = false;
let yBase = 0;                                   // altura "de reposo" del modelo; el paseo la hace rebotar un poco
const paseo = { activo: false, dir: 1, fuerza: 0 };   // fuerza: 0 quieta, 1 caminando (se suaviza)
const mirada = { x: 0, y: 0, objX: 0, objY: 0 };      // hacia dónde mira (-1 a 1), enviada por la app de escritorio
let audioActual = null, nivelBoca = 0;   // voz en reproducción y apertura de boca suavizada
let personaje = { nombre: "Asistente", saludo: "Hola.", reinicio: "Empecemos de nuevo.", idioma: "es" };
const L = (es, en) => (personaje.idioma === "en" ? en : es);       // textos de la interfaz según IDIOMA del servidor

let temporizadorEmocion = null;
function fijarEmocion(nombre) {
  clearTimeout(temporizadorEmocion);
  objetivo = { ...BASE, ...(EMOCIONES[nombre] || {}) };
  sincronizarSliders();
  const grupo = MOVIMIENTOS[nombre];
  if (model && grupo) { try { model.motion(grupo); } catch (e) { /* sin animación */ } }
}

function luegoNeutral() {      // tras hablar, la cara vuelve sola a neutral pasados unos segundos
  clearTimeout(temporizadorEmocion);
  temporizadorEmocion = setTimeout(() => fijarEmocion("neutral"), EMOCION_DURA_S * 1000);
}

function colocar() {
  if (!model || !app) return;
  const W = app.screen.width, H = app.screen.height;
  const escala = Math.min(W / anchoBase, H / altoBase) * 0.95 * ZOOM;
  model.scale.set(escala);
  model.anchor.set(0.5, 0);
  const alto = altoBase * escala;
  model.x = W / 2;
  model.y = (H > alto ? (H - alto) / 2 : 0) + DESPLAZAMIENTO_Y;
  yBase = model.y;
}

function resolverParametros() {
  // Lista de parámetros que tiene el modelo cargado
  let existentes = null;
  try { existentes = new Set(model.internalModel.coreModel.getModel().parameters.ids); } catch (e) {}
  const tiene = (id) => !existentes || existentes.has(id);
  const mapa = {};
  const ids = new Set([...Object.keys(BASE), ...Object.keys(ALIAS), ...Object.keys(EFECTOS), ...Object.values(EMOCIONES).flatMap((e) => Object.keys(e))]);
  for (const id of ids) {
    mapa[id] = [id, ...(ALIAS[id] || [])].find(tiene) || null;
  }
  console.info("Parámetros sin equivalente en este modelo:", Object.keys(mapa).filter((k) => !mapa[k]).join(", ") || "ninguno");
  return mapa;
}

function agregarSlidersDeEfectos() {       // un control en «ajustes» por cada efecto que tenga el modelo
  for (const id in sliders) if (idReal[id] === null) sliders[id].parentElement.style.display = "none";   // el modelo no lo tiene
  for (const [id, nombre] of Object.entries(EFECTOS)) {
    if (!idReal[id] || sliders[id]) continue;
    const fila = document.createElement("label");
    const etiqueta = document.createElement("span");
    etiqueta.textContent = nombre;
    const r = document.createElement("input");
    let minimo = 0;                         // el rango (0 a 1 o -1 a 1) se lee del modelo
    try {
      const ps = model.internalModel.coreModel.getModel().parameters;
      minimo = ps.minimumValues[Array.from(ps.ids).indexOf(idReal[id])] < 0 ? -1 : 0;
    } catch (e) { /* se queda en 0 a 1 */ }
    r.type = "range"; r.min = minimo; r.max = 1; r.step = 0.05; r.value = 0;
    r.addEventListener("input", () => { objetivo[id] = parseFloat(r.value); });
    sliders[id] = r;
    fila.append(etiqueta, r);
    panel.insertBefore(fila, botonCopiar);
  }
}

async function cargarModelo() {
  if (typeof PIXI === "undefined" || !PIXI.live2d || typeof Live2DCubismCore === "undefined") {
    throw new Error("No se cargaron las librerías (¿hay internet?).");
  }
  try { PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker); } catch (e) {}
  app = new PIXI.Application({
    view: document.getElementById("lienzo"), resizeTo: escena, backgroundAlpha: 0,
    antialias: true, autoDensity: true, resolution: window.devicePixelRatio || 1,
  });
  model = await PIXI.live2d.Live2DModel.from(personaje.modelo || MODELO_URL);   // el servidor indica cuál hay en la carpeta modelo
  model.autoInteract = false;     // la mirada la controlamos nosotros (también funciona con el cursor fuera de la ventana)
  anchoBase = model.width; altoBase = model.height;
  app.stage.addChild(model);
  colocar();
  app.renderer.on("resize", colocar);

  idReal = resolverParametros();
  agregarSlidersDeEfectos();

  // Se ejecuta en cada fotograma, después de las animaciones y antes de dibujar:
  // aquí aplicamos la expresión (suavizada) y el movimiento de la boca al hablar.
  model.internalModel.on("beforeModelUpdate", () => {
    const core = model.internalModel.coreModel;
    const t = performance.now() / 1000;
    for (const id of Object.keys({ ...actual, ...objetivo })) {   // lo que ya no está en la emoción vuelve a 0 suavemente
      const real = idReal[id];
      if (!real) continue;                                        // este modelo no tiene ese parámetro
      actual[id] = (actual[id] || 0) + ((objetivo[id] || 0) - (actual[id] || 0)) * 0.12;
      let v = actual[id];
      if (id === "PARAM_MOUTH_OPEN_Y") {
        if (audioActual && !audioActual.paused) {      // sigue el volumen de la voz real
          nivelBoca += (medirNivel() - nivelBoca) * 0.5;
          v = Math.max(v, nivelBoca * 0.9);
        } else if (hablando) {                          // sin audio: movimiento simulado
          const habla = 0.2 + 0.5 * Math.abs(Math.sin(t * 11)) * (0.6 + 0.4 * Math.sin(t * 3.7));
          v = Math.max(v, habla);
        }
      }
      core.setParameterValueById(real, v);
    }

    // Mirada (sigue al cursor) y balanceo al caminar: se SUMAN a lo que ya haya (animaciones, física)
    mirada.x += (mirada.objX - mirada.x) * 0.1;
    mirada.y += (mirada.objY - mirada.y) * 0.1;
    paseo.fuerza += ((paseo.activo ? 1 : 0) - paseo.fuerza) * 0.06;
    const fase = t * 6.4;
    const sumar = (id, valor) => { const real = idReal[id]; if (real) core.addParameterValueById(real, valor); };
    sumar("PARAM_ANGLE_X", mirada.x * 25);
    sumar("PARAM_ANGLE_Y", -mirada.y * 15);
    sumar("PARAM_EYE_BALL_X", mirada.x);
    sumar("PARAM_EYE_BALL_Y", -mirada.y);
    sumar("PARAM_BODY_ANGLE_X", mirada.x * 3 + paseo.dir * 3 * paseo.fuerza);
    sumar("PARAM_ANGLE_Z", Math.sin(fase) * 5 * paseo.fuerza);
    sumar("PARAM_BODY_ANGLE_Z", Math.sin(fase) * 4 * paseo.fuerza);
    model.y = yBase - Math.abs(Math.sin(fase)) * 7 * paseo.fuerza;   // rebote de cada paso
  });
}

// =====================================================================
//  Botones de prueba y panel de ajuste de expresiones
// =====================================================================
const herramientas = document.getElementById("herramientas");
const panel = document.getElementById("ajustes");
const sliders = {};

for (const nombre of Object.keys(EMOCIONES)) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = nombre;
  b.addEventListener("click", () => fijarEmocion(nombre));
  herramientas.appendChild(b);
}

const botonAjustes = document.createElement("button");
botonAjustes.type = "button"; botonAjustes.textContent = "ajustes";
botonAjustes.addEventListener("click", () => { panel.hidden = !panel.hidden; });
herramientas.appendChild(botonAjustes);

for (const id of Object.keys(BASE)) {
  const fila = document.createElement("label");
  const etiqueta = document.createElement("span");
  etiqueta.textContent = id.replace("PARAM_", "");
  const r = document.createElement("input");
  r.type = "range"; r.min = -1; r.max = 1; r.step = 0.05; r.value = 0;
  r.addEventListener("input", () => { objetivo[id] = parseFloat(r.value); });
  sliders[id] = r;
  fila.append(etiqueta, r);
  panel.appendChild(fila);
}

const botonCopiar = document.createElement("button");
botonCopiar.type = "button"; botonCopiar.textContent = "copiar valores";
botonCopiar.addEventListener("click", async () => {
  const salida = {};
  for (const id in objetivo) {
    if (Math.abs(objetivo[id]) > 0.001) salida[id] = Math.round(objetivo[id] * 100) / 100;
  }
  const t = JSON.stringify(salida);
  try { await navigator.clipboard.writeText(t); botonCopiar.textContent = L("¡copiado!", "copied!"); }
  catch (e) { window.prompt(L("Copia estos valores:", "Copy these values:"), t); }
  setTimeout(() => { botonCopiar.textContent = L("copiar valores", "copy values"); }, 1500);
});
panel.appendChild(botonCopiar);

function sincronizarSliders() {
  for (const id in sliders) sliders[id].value = objetivo[id] || 0;
}

// =====================================================================
//  Chat
// =====================================================================
// ---------- Voz (el audio lo genera el servidor, con Piper local) ----------
let vozActiva = true;
try { vozActiva = localStorage.getItem("vozActiva") !== "no"; } catch (e) {}
let ctxAudio = null, analizador = null, bufAudio = null, ganancia = null;

// ---------- Volumen de la voz (se recuerda entre sesiones) ----------
const barraVolumen = document.getElementById("volumen");
const botonSilencio = document.getElementById("silencio");
let volumen = 0.8, silenciada = false;
try {
  const v = parseFloat(localStorage.getItem("volumenVoz"));
  if (v >= 0 && v <= 1) volumen = v;
  silenciada = localStorage.getItem("vozSilenciada") === "si";
} catch (e) {}
function volumenActual() { return silenciada ? 0 : volumen * volumen; }   // curva cuadrática: el oído percibe mejor así
function aplicarVolumen() {
  barraVolumen.value = Math.round(volumen * 100);
  botonSilencio.textContent = silenciada || volumen === 0 ? "🔇" : volumen < 0.5 ? "🔉" : "🔊";
  if (ganancia) ganancia.gain.value = volumenActual();
  try { localStorage.setItem("volumenVoz", String(volumen)); localStorage.setItem("vozSilenciada", silenciada ? "si" : "no"); } catch (e) {}
}
barraVolumen.addEventListener("input", () => { volumen = barraVolumen.value / 100; silenciada = false; aplicarVolumen(); });
botonSilencio.addEventListener("click", () => { silenciada = !silenciada; aplicarVolumen(); });
aplicarVolumen();
const estado = document.getElementById("estado");

const botonVoz = document.createElement("button");
botonVoz.type = "button";
function pintarBotonVoz() { botonVoz.textContent = L("voz: ", "voice: ") + (vozActiva ? L("sí", "on") : L("no", "off")); }
botonVoz.addEventListener("click", () => {
  vozActiva = !vozActiva;
  try { localStorage.setItem("vozActiva", vozActiva ? "si" : "no"); } catch (e) {}
  if (!vozActiva) detenerVoz();
  estado.textContent = "";
  pintarBotonVoz();
});
pintarBotonVoz();
herramientas.appendChild(botonVoz);

function prepararAudio() {
  if (!ctxAudio) {
    ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
    analizador = ctxAudio.createAnalyser();
    analizador.fftSize = 512;
    ganancia = ctxAudio.createGain();            // el volumen va DESPUÉS del analizador: la boca se mueve igual
    ganancia.gain.value = volumenActual();
    analizador.connect(ganancia);
    ganancia.connect(ctxAudio.destination);
    bufAudio = new Uint8Array(analizador.fftSize);
  }
  if (ctxAudio.state === "suspended") ctxAudio.resume();
}

function medirNivel() {            // volumen actual del audio, de 0 a 1
  analizador.getByteTimeDomainData(bufAudio);
  let suma = 0;
  for (const b of bufAudio) { const x = (b - 128) / 128; suma += x * x; }
  return Math.min(1, Math.sqrt(suma / bufAudio.length) * 5);
}

function detenerVoz() {
  if (audioActual) { audioActual.pause(); audioActual = null; }
  nivelBoca = 0;
}

async function cargarVoz(t) {      // pide el audio al servidor; devuelve un <audio> listo o null
  detenerVoz();
  if (!vozActiva) return null;
  // Sin ninguna interacción previa el navegador bloquea el audio (pasa con el saludo inicial)
  if (!window.escritorio && navigator.userActivation && !navigator.userActivation.hasBeenActive) return null;
  try {
    const r = await fetch("/voz", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto: t }) });
    if (!r.ok) {
      let detalle = "error " + r.status;
      try { detalle = (await r.json()).detail || detalle; } catch (e) {}
      throw new Error(detalle);
    }
    const url = URL.createObjectURL(await r.blob());
    const audio = new Audio(url);
    await new Promise((ok, mal) => {
      audio.addEventListener("loadedmetadata", ok, { once: true });
      audio.addEventListener("error", () => mal(new Error("el navegador no pudo leer el audio")), { once: true });
    });
    audio.addEventListener("ended", () => {
      URL.revokeObjectURL(url);
      if (audioActual === audio) audioActual = null;
    });
    const aviso = r.headers.get("X-Voz-Aviso");     // el servidor avisa si tuvo que usar una voz de respaldo y por qué
    estado.textContent = aviso ? "· " + decodeURIComponent(aviso) : "";
    return audio;
  } catch (e) {
    console.warn("Voz no disponible:", e);
    estado.textContent = L("· sin voz (", "· no voice (") + e.message + ")";
    return null;
  }
}

async function reproducir(audio) {  // conecta el audio al analizador y lo inicia
  try {
    prepararAudio();
    ctxAudio.createMediaElementSource(audio).connect(analizador);
    audioActual = audio;
    await audio.play();
    if (ctxAudio.state !== "running") estado.textContent = L("· el audio esta bloqueado por el sistema (haz clic en la ventana)", "· audio is blocked by the system (click the window)");
    return true;
  } catch (e) {
    console.warn("No pude reproducir el audio:", e);
    estado.textContent = L("· no pude reproducir la voz (", "· could not play the voice (") + e.message + ")";
    audioActual = null;
    return false;
  }
}

async function decir(t) {          // texto y voz a la vez; sin voz, solo texto
  const audio = await cargarVoz(t);
  const sonando = audio ? await reproducir(audio) : false;
  const duracion = sonando && isFinite(audio.duration) ? audio.duration * 1000 : null;
  escribir(t, duracion);
}

const form = document.getElementById("entrada");
const msg = document.getElementById("msg");
const enviar = document.getElementById("enviar");
let temporizador = null;

function escribir(t, duracionMs) { // máquina de escribir; con voz, termina junto con el audio
  clearInterval(temporizador);
  texto.textContent = "";
  hablando = true;
  const paso = duracionMs ? Math.min(90, Math.max(15, duracionMs / t.length)) : 28;
  let i = 0;
  temporizador = setInterval(() => {
    texto.textContent += t[i++];
    if (i >= t.length) { clearInterval(temporizador); hablando = false; }
  }, paso);
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const t = msg.value.trim();
  if (!t) return;
  msg.value = "";
  enviar.disabled = true;
  clearInterval(temporizador); hablando = false; detenerVoz();
  texto.textContent = "...";
  try {
    const r = await fetch("/chat", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto: t }) });
    const d = await r.json();
    fijarEmocion(d.emocion || "neutral");
    await decir(d.texto);
    luegoNeutral();
  } catch (e) {
    fijarEmocion("triste");
    texto.textContent = L("No pude conectar con el servidor.", "I couldn't reach the server.");
  }
  enviar.disabled = false;
  msg.focus();
});

document.getElementById("reset").addEventListener("click", async () => {
  try { await fetch("/reset", { method: "POST" }); } catch (e) {}
  fijarEmocion("neutral");
  await decir(personaje.reinicio);
});

// =====================================================================
//  Micrófono: grabar -> /oir (Whisper local en el servidor) -> se envía como mensaje
// =====================================================================
const botonMic = document.getElementById("mic");
const MIC = {
  umbral: 0.02,        // volumen mínimo (RMS, 0 a 1) para considerar que hay voz; súbelo si hay mucho ruido
  silencioMs: 1300,    // silencio después de hablar que da por terminada la frase
  esperaVozMs: 8000,   // si nadie habla en este tiempo, se cancela
  maxMs: 25000,        // duración máxima de una grabación
};
let grabacion = null;

async function empezarEscucha() {
  if (grabacion || enviar.disabled) return;      // ya escuchando, o esperando una respuesta
  detenerVoz(); clearInterval(temporizador); hablando = false;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    texto.textContent = L("Aquí no se puede usar el micrófono.", "The microphone can't be used here."); return;
  }
  let flujo;
  try {
    flujo = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    texto.textContent = L("No pude abrir el micrófono (", "I couldn't open the microphone (") + (e.name === "NotAllowedError"
      ? L("sin permiso: revisa la privacidad del micrófono en Windows", "no permission: check the microphone privacy settings in Windows") : e.message) + ").";
    return;
  }
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const fuente = ctx.createMediaStreamSource(flujo);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const g = { flujo, ctx, fuente, proc, trozos: [], inicio: performance.now(),
              hablo: false, ultimaVoz: 0, terminada: false };
  proc.onaudioprocess = (ev) => {
    if (g.terminada) return;
    const datos = ev.inputBuffer.getChannelData(0);
    g.trozos.push(new Float32Array(datos));       // copia: el navegador reutiliza el búfer
    let suma = 0;
    for (let i = 0; i < datos.length; i++) suma += datos[i] * datos[i];
    const ahora = performance.now();
    if (Math.sqrt(suma / datos.length) > MIC.umbral) { g.hablo = true; g.ultimaVoz = ahora; }
    if (g.hablo && ahora - g.ultimaVoz > MIC.silencioMs) terminarEscucha(true);
    else if (!g.hablo && ahora - g.inicio > MIC.esperaVozMs) terminarEscucha(true);
    else if (ahora - g.inicio > MIC.maxMs) terminarEscucha(true);
  };
  fuente.connect(proc);
  proc.connect(ctx.destination);                  // el procesador debe estar conectado para funcionar (no suena nada)
  grabacion = g;
  botonMic.classList.add("escuchando");
  texto.textContent = L("Te escucho...", "I'm listening...");
}

function aPCM16(trozos, tasa) {                   // Float32 -> enteros de 16 bits a 16 kHz
  let total = 0;
  for (const t of trozos) total += t.length;
  const todo = new Float32Array(total);
  let pos = 0;
  for (const t of trozos) { todo.set(t, pos); pos += t.length; }
  let mono = todo;
  if (Math.abs(tasa - 16000) > 1) {               // por si el navegador no respetó los 16 kHz
    const n = Math.floor(todo.length * 16000 / tasa);
    mono = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = i * tasa / 16000, i0 = Math.floor(x), f = x - i0;
      mono[i] = (todo[i0] || 0) * (1 - f) + (todo[i0 + 1] || 0) * f;
    }
  }
  const salida = new Int16Array(mono.length);
  for (let i = 0; i < mono.length; i++) salida[i] = Math.max(-1, Math.min(1, mono[i])) * 32767;
  return salida.buffer;
}

async function terminarEscucha(enviarAudio) {     // enviarAudio = false cancela sin transcribir
  const g = grabacion;
  if (!g || g.terminada) return;
  g.terminada = true; grabacion = null;
  botonMic.classList.remove("escuchando");
  g.proc.disconnect(); g.fuente.disconnect();
  g.flujo.getTracks().forEach((t) => t.stop());   // apaga el micrófono
  const tasa = g.ctx.sampleRate;
  g.ctx.close().catch(() => {});
  if (!enviarAudio) { texto.textContent = L("Cancelado.", "Cancelled."); return; }
  if (!g.hablo) { texto.textContent = L("No te escuché. Prueba de nuevo.", "I didn't hear you. Try again."); return; }

  texto.textContent = L("Entendiendo lo que dijiste... (la primera vez puede tardar: descarga el modelo)", "Understanding what you said... (the first time can take a while: it downloads the model)");
  try {
    const r = await fetch("/oir", { method: "POST",
      headers: { "Content-Type": "application/octet-stream" }, body: aPCM16(g.trozos, tasa) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ("error " + r.status));
    const dicho = (d.texto || "").trim();
    if (!dicho) { texto.textContent = L("No te entendí. ¿Puedes repetirlo?", "I didn't catch that. Can you repeat it?"); return; }
    msg.value = dicho;
    form.requestSubmit();                          // se envía como cualquier mensaje escrito
  } catch (e) {
    fijarEmocion("triste");
    texto.textContent = L("No pude entenderte: ", "I couldn't understand you: ") + e.message;
  }
}

botonMic.addEventListener("click", () => { if (grabacion) terminarEscucha(true); else empezarEscucha(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && grabacion) terminarEscucha(false); });

// =====================================================================
//  Inicio
// =====================================================================
// =====================================================================
//  Modo compañera (ventana flotante de Electron)
// =====================================================================
const puente = window.escritorio || null;     // lo expone preload.js; en el navegador es null
const lienzo = document.getElementById("lienzo");
const burbuja = document.getElementById("burbuja");
const raiz = document.documentElement;
let arrastre = null, ocultarBurbuja = null, ignorando = null;

function mostrarBurbuja() {        // la burbuja se oculta sola unos segundos después de hablar
  burbuja.classList.remove("oculta");
  clearTimeout(ocultarBurbuja);
  if (!form.classList.contains("visible")) {
    ocultarBurbuja = setTimeout(() => burbuja.classList.add("oculta"), 8000);
  }
}
function abrirChat() { form.classList.add("visible"); msg.focus(); mostrarBurbuja(); }
function cerrarChat() { form.classList.remove("visible"); mostrarBurbuja(); }

if (raiz.classList.contains("companera")) {
  // Cualquier cambio en el texto muestra la burbuja y reinicia el temporizador
  new MutationObserver(mostrarBurbuja).observe(texto, { childList: true, characterData: true, subtree: true });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarChat(); });
  window.addEventListener("blur", cerrarChat);
}

if (puente) {
  puente.alAbrirChat(abrirChat);
  puente.alReiniciar(() => document.getElementById("reset").click());
  puente.alAlternarHerramientas(() => raiz.classList.toggle("herramientas"));
  puente.alEscuchar(() => { abrirChat(); empezarEscucha(); });
  puente.alPaseo((d) => { paseo.activo = !!d.caminando; if (d.dir) paseo.dir = d.dir; });
  puente.alMirar((d) => { mirada.objX = d.x; mirada.objY = d.y; });
  // Avisa a la app cuando está "ocupada" (chat abierto, hablando, escuchando o con la burbuja visible): no camina
  let avisadaOcupada = null;
  setInterval(() => {
    const ocupada = form.classList.contains("visible") || !burbuja.classList.contains("oculta") || hablando ||
      !!(audioActual && !audioActual.paused) || botonMic.classList.contains("escuchando") ||
      raiz.classList.contains("herramientas");
    if (ocupada !== avisadaOcupada) { avisadaOcupada = ocupada; puente.ocupada(ocupada); }
  }, 250);

  // Arrastrar al personaje para mover la ventana; un toque sin mover reproduce un gesto
  lienzo.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    arrastre = { x: e.screenX, y: e.screenY, movido: false };
    try { lienzo.setPointerCapture(e.pointerId); } catch (err) {}
  });
  lienzo.addEventListener("pointermove", (e) => {
    if (!arrastre) return;
    const dx = e.screenX - arrastre.x, dy = e.screenY - arrastre.y;
    if (!arrastre.movido && Math.hypot(dx, dy) < 4) return;
    if (!arrastre.movido) reaccionar("levantada");
    arrastre.movido = true;
    arrastre.x = e.screenX; arrastre.y = e.screenY;
    puente.mover(dx, dy);
  });
  lienzo.addEventListener("pointerup", () => {
    if (arrastre && !arrastre.movido && model) { try { model.motion("Tap"); } catch (err) {} contarToque(); }
    if (arrastre && arrastre.movido && Math.random() < 0.5) setTimeout(() => reaccionar("soltada", true), 1800);   // a veces se queja al soltarla
    arrastre = null;
  });
  lienzo.addEventListener("dblclick", abrirChat);

  // Las zonas vacías dejan pasar los clics al escritorio; sobre el personaje o los controles, no
  document.addEventListener("mousemove", (e) => {
    if (arrastre) return;
    const t = e.target;
    const sobreInterfaz = !!(t.closest && (
      t.closest("#burbuja:not(.oculta)") || t.closest("#entrada.visible") ||
      (raiz.classList.contains("herramientas") && t.closest("#herramientas, #ajustes"))));
    let sobreModelo = false;
    if (model) {
      const b = model.getBounds();
      const mx = b.width * 0.15, my = b.height * 0.05;   // margen: el recuadro incluye zonas vacías
      sobreModelo = e.clientX > b.x + mx && e.clientX < b.x + b.width - mx &&
                    e.clientY > b.y + my && e.clientY < b.y + b.height - my;
    }
    const ignorar = !(sobreInterfaz || sobreModelo);
    if (ignorar !== ignorando) { ignorando = ignorar; puente.clicAtraves(ignorar); }
  });
}

// =====================================================================
//  Reacciones espontáneas: comenta cosas por sí sola (sin usar el modelo de lenguaje)
// =====================================================================
const REACCIONES_ACTIVAS = true;
const REACCIONES_CON_VOZ = false;       // true = también las dice en voz alta (gasta créditos de ElevenLabs; las frases cortas se guardan en caché)
const REACC = {
  reposoMin: 4, reposoMax: 9,           // minutos sin interacción antes de quejarse (se elige uno al azar en ese rango)
  enfriamientoS: 20,                    // segundos mínimos entre dos reacciones
  toques: 4, ventanaToquesS: 3,         // tantos clics seguidos en tan pocos segundos la enojan
};
const FRASES = {
  en: {
    reposo:   [["...Hello? Did you forget about me?", "triste"], ["Tch. Ignored again, huh.", "enojada"],
               ["I'm bored. Say something.", "neutral"], ["Not that I care, but are you still alive over there?", "avergonzada"]],
    levantada:[["H-hey! Put me down!", "sorprendida"], ["Whoa! Where are you taking me?!", "sorprendida"], ["Hands off the merchandise!", "enojada"]],
    soltada:  [["...Don't just drop me like that.", "enojada"], ["Tch. Rude.", "enojada"], ["Fine. I liked it here anyway.", "neutral"]],
    toques:   [["Stop poking me!", "enojada"], ["I said stop it!", "enojada"], ["D-do you think this is funny?!", "avergonzada"]],
  },
  es: {
    reposo:   [["...¿Hola? ¿Te olvidaste de mí?", "triste"], ["Tch. Ignorada otra vez, ¿eh?", "enojada"],
               ["Me aburro. Di algo.", "neutral"], ["No es que me importe, pero ¿sigues vivo por ahí?", "avergonzada"]],
    levantada:[["¡O-oye! ¡Bájame!", "sorprendida"], ["¡Whoa! ¿A dónde me llevas?!", "sorprendida"], ["¡Con las manos quietas!", "enojada"]],
    soltada:  [["...No me sueltes así nomás.", "enojada"], ["Tch. Qué grosero.", "enojada"], ["Bien. De todos modos me gustaba este lugar.", "neutral"]],
    toques:   [["¡Deja de picarme!", "enojada"], ["¡Dije que ya basta!", "enojada"], ["¿T-te parece gracioso?!", "avergonzada"]],
  },
};
let ultimaActividad = Date.now(), ultimaReaccion = 0, proximoReposoMs = 0;
let toquesRecientes = [], ultimaFrase = {};
const programarReposo = () => { proximoReposoMs = (REACC.reposoMin + Math.random() * (REACC.reposoMax - REACC.reposoMin)) * 60000; };
programarReposo();
function hayActividad() { ultimaActividad = Date.now(); }

function reaccionOcupada() {
  return form.classList.contains("visible") || hablando || enviar.disabled ||
    !!(audioActual && !audioActual.paused) || (typeof botonMic !== "undefined" && botonMic.classList.contains("escuchando"));
}
function reaccionar(tipo, sinEnfriamiento) {   // devuelve true si dijo algo
  if (!REACCIONES_ACTIVAS || !model || reaccionOcupada()) return false;
  if (!sinEnfriamiento && Date.now() - ultimaReaccion < REACC.enfriamientoS * 1000) return false;
  const lista = (FRASES[personaje.idioma] || FRASES.es)[tipo];
  if (!lista) return false;
  let i = Math.floor(Math.random() * lista.length);
  if (lista.length > 1 && i === ultimaFrase[tipo]) i = (i + 1) % lista.length;     // no repetir la misma dos veces seguidas
  ultimaFrase[tipo] = i;
  const [frase, emocion] = lista[i];
  ultimaReaccion = Date.now();
  fijarEmocion(emocion);
  if (REACCIONES_CON_VOZ) decir(frase).then(luegoNeutral).catch(() => escribir(frase, null));
  else { escribir(frase, null); luegoNeutral(); }
  return true;
}
function revisarReposo() {
  if (Date.now() - ultimaActividad < proximoReposoMs) return;
  if (reaccionar("reposo")) { hayActividad(); programarReposo(); }
}
function contarToque() {
  const ahora = Date.now();
  toquesRecientes = toquesRecientes.filter((t) => ahora - t < REACC.ventanaToquesS * 1000);
  toquesRecientes.push(ahora);
  if (toquesRecientes.length >= REACC.toques && reaccionar("toques")) toquesRecientes = [];
}
setInterval(revisarReposo, 15000);
document.addEventListener("pointerdown", hayActividad, true);
document.addEventListener("keydown", hayActividad, true);

// =====================================================================
//  Recordatorios: el servidor guarda los pendientes; la página pregunta si ya toca avisar
// =====================================================================
let revisandoRecordatorio = false;
async function revisarRecordatorios() {
  if (revisandoRecordatorio || !model) return;
  if (form.classList.contains("visible") || hablando || enviar.disabled ||
      (audioActual && !audioActual.paused) || (typeof botonMic !== "undefined" && botonMic.classList.contains("escuchando"))) return;   // espera su turno
  revisandoRecordatorio = true;
  try {
    const d = await (await fetch("/recordatorios/vencido")).json();
    if (d.texto) {
      hayActividad();
      fijarEmocion("emocionada");
      await decir(d.texto);
      luegoNeutral();
    }
  } catch (e) { /* servidor ocupado: se reintenta en el siguiente ciclo */ }
  revisandoRecordatorio = false;
}
setInterval(revisarRecordatorios, 4000);

function traducirInterfaz() {         // textos fijos del HTML, según el idioma que informa el servidor
  if (personaje.idioma !== "en") return;
  document.documentElement.lang = "en";
  msg.placeholder = "Type something...";
  enviar.textContent = "Send";
  const reiniciar = document.getElementById("reset");
  reiniciar.textContent = "Reset"; reiniciar.title = "Clear the conversation";
  botonMic.title = "Speak: click to start, click again to finish";
  document.getElementById("silencio").title = "Click: mute. Hover for the volume";
  const vol = document.getElementById("volumen");
  vol.title = "Voice volume"; vol.setAttribute("aria-label", "Voice volume");
  herramientas.title = "Try the expressions without talking to the language model";
  botonAjustes.textContent = "settings";
  botonCopiar.textContent = "copy values";
  pintarBotonVoz();
  const nota = panel.querySelector(".nota");
  if (nota) nota.innerHTML = "Move the sliders to see the face live. When you like it, press «copy values» and paste the result inside the matching emotion in <code>EMOCIONES</code> (index.html).";
}

async function iniciar() {
  try {
    const r = await fetch("/info");
    personaje = { ...personaje, ...(await r.json()) };
  } catch (e) { /* se usan los valores por defecto */ }
  if (personaje.oido === false) {
    botonMic.disabled = true;
    botonMic.title = L("Falta instalar faster-whisper (pip install faster-whisper)", "faster-whisper is not installed (pip install faster-whisper)");
  }
  document.title = personaje.nombre;
  document.getElementById("nombre-texto").textContent = personaje.nombre;
  traducirInterfaz();
  texto.textContent = L("Cargando a ", "Loading ") + personaje.nombre + "...";

  try {
    await cargarModelo();
    fijarEmocion("neutral");
    await decir(personaje.saludo);
  } catch (e) {
    console.error(e);
    texto.textContent = L("No pude cargar el modelo (", "I couldn't load the model (") + (personaje.modelo || MODELO_URL) + "): " + e.message +
      L(" Revisa que la carpeta 'modelo' tenga el contenido de 'runtime'. Aun así puedes chatear.", " Check that the 'modelo' folder has the contents of 'runtime'. You can still chat.");
  }
}
iniciar();
